<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>카드 뽑기</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #ccff00;
      --bg: #ffffff;
      --surface: #f4f4f4;
      --border: #1a1a1a;
      --border-light: #e0e0e0;
      --text: #0a0a0a;
      --muted: #999999;
      --font: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    body {
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Screens ─────────────────────────────── */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 50;
      background: var(--bg);
    }
    .screen.gone { display: none; }

    .spinner {
      width: 30px; height: 30px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err-msg {
      font-size: 0.92rem;
      font-weight: 500;
      color: var(--text);
      text-align: center;
      line-height: 1.65;
      max-width: 240px;
      white-space: pre-line;
    }

    .btn-close {
      padding: 10px 26px;
      background: var(--text);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.86rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0.03em;
    }

    /* ── Main ────────────────────────────────── */
    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }
    .main.gone { display: none; }

    /* ── Stage ───────────────────────────────── */
    .stage {
      position: relative;
      width: 260px;
      height: 380px;
      perspective: 900px;
    }

    /* ── Card ────────────────────────────────── */
    .card-container {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.88) translateY(16px);
      pointer-events: none;
    }

    .card-flipper {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-flipper.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Back face */
    .c-back {
      background: var(--surface);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .c-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent 0, transparent 4px,
        rgba(0,0,0,0.035) 4px, rgba(0,0,0,0.035) 5px
      );
    }

    .c-back-label {
      position: relative;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: rgba(0,0,0,0.18);
      text-transform: uppercase;
    }

    /* Front face */
    .c-front {
      transform: rotateY(180deg);
      background: #fff;
      border: 1.5px solid var(--border);
      overflow: hidden;
    }

    /* Top accent line */
    .card-top-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--border-light);
      z-index: 3;
    }

    /* Rare card overrides */
    .c-front.is-rare {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent), 0 0 28px rgba(204,255,0,0.2);
    }
    .c-front.is-rare .card-top-line { background: var(--accent); }

    /* Rare shimmer */
    .rare-holo {
      display: none;
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        transparent 28%, rgba(204,255,0,0.05) 43%,
        rgba(204,255,0,0.1) 50%, rgba(204,255,0,0.05) 57%,
        transparent 72%
      );
      background-size: 200% 200%;
      animation: holoShift 3s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes holoShift {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* Sparkles (rare) */
    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 10;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      animation: sparkAnim var(--dur,1.5s) ease-in-out var(--delay,0s) infinite;
      background: var(--color, var(--accent));
    }
    @keyframes sparkAnim {
      0% { transform: scale(0); opacity: 0; }
      25% { opacity: 1; }
      60% { transform: scale(1) rotate(180deg); opacity: 0.7; }
      100% { transform: scale(0) rotate(360deg) translate(var(--tx,0), var(--ty,0)); opacity: 0; }
    }

    /* Card content */
    .card-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 13px;
      gap: 10px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; }

    .cn-label {
      font-size: 0.67rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .rare-badge {
      display: none;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: var(--text);
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 3px;
    }

    .artwork-area {
      flex: 1;
      border-radius: 6px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .artwork-area img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .art-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%; height: 100%;
      gap: 4px;
    }

    .art-num {
      font-size: 3rem;
      font-weight: 700;
      color: rgba(0,0,0,0.07);
    }

    .art-lbl {
      font-size: 0.7rem;
      color: rgba(0,0,0,0.25);
      letter-spacing: 0.04em;
    }

    .card-footer { padding: 2px 0; }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      text-align: center;
      color: var(--text);
    }

    .card-series {
      font-size: 0.65rem;
      text-align: center;
      color: var(--muted);
      margin-top: 2px;
      letter-spacing: 0.04em;
    }

    /* Corner accents */
    .c-corner {
      position: absolute;
      width: 14px; height: 14px;
      z-index: 3;
      border-color: var(--border-light);
    }
    .c-tl { top: 9px; left: 9px; border-top: 1.5px solid; border-left: 1.5px solid; border-radius: 2px 0 0 0; }
    .c-tr { top: 9px; right: 9px; border-top: 1.5px solid; border-right: 1.5px solid; border-radius: 0 2px 0 0; }
    .c-bl { bottom: 9px; left: 9px; border-bottom: 1.5px solid; border-left: 1.5px solid; border-radius: 0 0 0 2px; }
    .c-br { bottom: 9px; right: 9px; border-bottom: 1.5px solid; border-right: 1.5px solid; border-radius: 0 0 2px 0; }

    /* ── Pack ────────────────────────────────── */
    .pack-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .pack-wrap.floating { animation: packFloat 3s ease-in-out infinite; }
    @keyframes packFloat {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .pack-flap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      transform-origin: center bottom;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .flap-front, .flap-back {
      position: absolute;
      inset: 0;
      border-radius: 14px 14px 0 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .flap-front {
      background: #fff;
      border: 1.5px solid var(--border);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    /* Fluorescent green top stripe */
    .flap-front::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--accent);
    }

    .flap-back {
      transform: rotateX(180deg);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-bottom: none;
    }

    .pack-name {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--text);
      text-transform: uppercase;
      position: relative;
      z-index: 1;
    }

    .pack-sub-name {
      font-size: 0.55rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }

    .pack-body {
      position: absolute;
      top: 40%; left: 0; right: 0; bottom: 0;
      background: var(--surface);
      border-radius: 0 0 14px 14px;
      border: 1.5px solid var(--border);
      border-top: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      will-change: transform, opacity;
    }

    .body-title {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.3);
    }

    .body-year {
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: rgba(0,0,0,0.18);
    }

    /* Perforated tear line */
    .tear-line {
      position: absolute;
      left: 0; right: 0;
      top: calc(40% - 1px);
      height: 1px;
      background: repeating-linear-gradient(
        90deg,
        var(--border) 0, var(--border) 4px,
        transparent 4px, transparent 9px
      );
      z-index: 20;
      pointer-events: none;
    }

    /* ── Drag hint ───────────────────────────── */
    .drag-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: opacity 0.3s;
    }

    .hint-arrow {
      width: 24px; height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounceUp 1.1s ease-in-out infinite;
    }

    /* CSS arrow (no emoji) */
    .hint-arrow::before {
      content: '';
      display: block;
      width: 10px; height: 10px;
      border-top: 2px solid var(--text);
      border-right: 2px solid var(--text);
      transform: rotate(-45deg) translateY(3px);
    }

    @keyframes bounceUp {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .hint-text {
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    /* ── Action buttons ──────────────────────── */
    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 260px;
    }
    .action-btns.gone { display: none; }

    .btn-save {
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.15s, transform 0.12s;
    }
    .btn-save:hover { opacity: 0.88; }
    .btn-save:active { transform: scale(0.98); }
    .btn-save:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-retry {
      padding: 13px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.15s;
    }
    .btn-retry:hover { background: var(--surface); }

    /* ── Toast ───────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--text);
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.82rem;
      font-family: var(--font);
      color: #fff;
      font-weight: 500;
      opacity: 0;
      transition: all 0.28s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Loading -->
  <div class="screen" id="scrLoading">
    <div class="spinner"></div>
  </div>

  <!-- Error -->
  <div class="screen gone" id="scrError">
    <div class="err-msg" id="errMsg"></div>
    <button class="btn-close" onclick="window.close()">닫기</button>
  </div>

  <!-- Main -->
  <div class="main gone" id="scrMain">

    <div class="stage" id="stage">

      <!-- Card (behind pack) -->
      <div class="card-container" id="cardContainer">
        <div class="card-flipper" id="cardFlipper">

          <div class="card-face c-back">
            <span class="c-back-label">Card Gacha</span>
          </div>

          <div class="card-face c-front" id="cardFront">
            <div class="card-top-line"></div>
            <div class="rare-holo" id="rareHolo"></div>
            <div class="sparkles" id="sparkles"></div>
            <div class="c-corner c-tl"></div>
            <div class="c-corner c-tr"></div>
            <div class="c-corner c-bl"></div>
            <div class="c-corner c-br"></div>
            <div class="card-inner">
              <div class="card-header">
                <span class="cn-label" id="cnLabel">#001</span>
                <span class="rare-badge" id="rareBadge">RARE</span>
              </div>
              <div class="artwork-area" id="artworkArea">
                <div class="art-placeholder">
                  <div class="art-num" id="artNum">1</div>
                  <div class="art-lbl">작품 준비 중</div>
                </div>
              </div>
              <div class="card-footer">
                <div class="card-title" id="cardTitle">작품 1</div>
                <div class="card-series" id="cardSeries">카드깡 컬렉션 · 2026</div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Pack (front layer) -->
      <div class="pack-wrap floating" id="packWrap">
        <div class="pack-flap" id="packFlap">
          <div class="flap-front">
            <div class="pack-name">Card Gacha</div>
            <div class="pack-sub-name">카드깡 컬렉션</div>
          </div>
          <div class="flap-back"></div>
        </div>
        <div class="pack-body" id="packBody">
          <div class="body-title">카드깡</div>
          <div class="body-year">2026</div>
        </div>
        <div class="tear-line" id="tearLine"></div>
      </div>

    </div>

    <!-- Drag hint -->
    <div class="drag-hint" id="dragHint">
      <div class="hint-arrow"></div>
      <span class="hint-text">위로 당겨서 뜯기</span>
    </div>

    <!-- Buttons -->
    <div class="action-btns gone" id="actionBtns">
      <button class="btn-save" id="btnSave" onclick="saveCard()">갤러리에 저장</button>
      <button class="btn-retry" onclick="location.reload()">다시 뽑기</button>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SECRET = 'cgk26_9qM_rnd';
    const EXPIRE_MS = 30000;

    function simpleHash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function parseToken(t) {
      try {
        const pad = t.length % 4;
        const decoded = atob((t + (pad ? '='.repeat(4 - pad) : '')).replace(/-/g,'+').replace(/_/g,'/'));
        const [cn, ir, ts, sig] = decoded.split(':');
        if (simpleHash(`${cn}:${ir}:${ts}` + SECRET) !== sig) return null;
        return { cardNum: parseInt(cn), isRare: ir === '1', ts: parseInt(ts) };
      } catch { return null; }
    }

    // ── State ──
    let cardData = null;
    let tearDone = false;
    let dragStartY = null;
    let isDragging = false;
    let currentProgress = 0;
    const DRAG_FULL = 155;

    // ── DOM ──
    const scrLoading   = document.getElementById('scrLoading');
    const scrError     = document.getElementById('scrError');
    const scrMain      = document.getElementById('scrMain');
    const packWrap     = document.getElementById('packWrap');
    const packFlap     = document.getElementById('packFlap');
    const packBody     = document.getElementById('packBody');
    const tearLine     = document.getElementById('tearLine');
    const dragHint     = document.getElementById('dragHint');
    const cardContainer = document.getElementById('cardContainer');
    const cardFlipper  = document.getElementById('cardFlipper');
    const cardFront    = document.getElementById('cardFront');
    const actionBtns   = document.getElementById('actionBtns');
    const sparklesEl   = document.getElementById('sparkles');

    // ── Setup card ──
    function setupCard(cardNum, isRare) {
      cardData = { cardNum, isRare };

      document.getElementById('cnLabel').textContent = `#${String(cardNum).padStart(3, '0')}`;
      document.getElementById('artNum').textContent = cardNum;
      document.getElementById('cardTitle').textContent = `작품 ${cardNum}`;

      if (isRare) {
        cardFront.classList.add('is-rare');
        document.getElementById('rareBadge').style.display = 'block';
        document.getElementById('rareHolo').style.display = 'block';
        document.getElementById('cardSeries').textContent = 'RARE — 카드깡 컬렉션 · 2026';
        document.getElementById('cardSeries').style.color = '#999';
        // Green corners on rare
        cardFront.querySelectorAll('.c-corner').forEach(c => c.style.borderColor = 'var(--accent)');
      }
    }

    // ── Tear mechanics ──
    function applyTear(p) {
      packFlap.style.transform = `rotateX(-${p * 172}deg)`;
      packFlap.style.opacity = p > 0.7 ? String(1 - (p - 0.7) / 0.3) : '1';
      packBody.style.transform = `translateY(${p * 14}px)`;
      if (p > 0.5) packBody.style.opacity = String(1 - (p - 0.5) / 0.5);
      tearLine.style.opacity = String(Math.max(0, 1 - p * 2));
      cardContainer.style.opacity = String(Math.min(1, p * 1.7));
      cardContainer.style.transform = `scale(${0.88 + p * 0.12}) translateY(${(1 - p) * 16}px)`;
      dragHint.style.opacity = String(Math.max(0, 1 - p * 5));
    }

    function completeTear() {
      tearDone = true;
      packWrap.classList.remove('floating');

      packFlap.style.transition = 'transform 0.46s ease-out, opacity 0.3s ease-out';
      packFlap.style.transform = 'rotateX(-195deg) translateY(-48px)';
      packFlap.style.opacity = '0';

      packBody.style.transition = 'transform 0.38s ease-in, opacity 0.3s ease-out';
      packBody.style.transform = 'translateY(88px)';
      packBody.style.opacity = '0';

      tearLine.style.transition = 'opacity 0.2s';
      tearLine.style.opacity = '0';
      dragHint.style.opacity = '0';

      setTimeout(() => {
        cardContainer.style.transition = 'transform 0.52s cubic-bezier(0.34,1.56,0.64,1), opacity 0.26s';
        cardContainer.style.opacity = '1';
        cardContainer.style.transform = 'scale(1) translateY(0)';

        setTimeout(() => {
          cardFlipper.classList.add('flipped');
          if (cardData.isRare) setTimeout(spawnSparkles, 640);
          setTimeout(() => actionBtns.classList.remove('gone'), 880);
        }, 460);
      }, 200);
    }

    function snapBack() {
      const t = '0.4s cubic-bezier(0.34,1.56,0.64,1)';
      packFlap.style.transition = `transform ${t}`;
      packFlap.style.transform = 'rotateX(0deg)';
      packFlap.style.opacity = '1';
      packBody.style.transition = `transform ${t}, opacity ${t}`;
      packBody.style.transform = 'translateY(0)';
      packBody.style.opacity = '1';
      tearLine.style.transition = 'opacity 0.3s';
      tearLine.style.opacity = '1';
      cardContainer.style.opacity = '0';
      cardContainer.style.transform = 'scale(0.88) translateY(16px)';
      dragHint.style.opacity = '1';
      currentProgress = 0;
      setTimeout(() => {
        packFlap.style.transition = '';
        packBody.style.transition = '';
        tearLine.style.transition = '';
      }, 430);
    }

    // ── Drag handlers ──
    function onStart(y) { if (tearDone) return; dragStartY = y; isDragging = true; packWrap.classList.remove('floating'); }
    function onMove(y) {
      if (!isDragging || tearDone) return;
      currentProgress = Math.max(0, Math.min(1, (dragStartY - y) / DRAG_FULL));
      applyTear(currentProgress);
    }
    function onEnd() {
      if (!isDragging || tearDone) return;
      isDragging = false;
      if (currentProgress > 0.5) { completeTear(); }
      else { packWrap.classList.add('floating'); snapBack(); }
    }

    document.addEventListener('touchstart', e => onStart(e.touches[0].clientY), { passive: true });
    document.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientY); }, { passive: false });
    document.addEventListener('touchend', onEnd);
    document.addEventListener('mousedown', e => onStart(e.clientY));
    document.addEventListener('mousemove', e => onMove(e.clientY));
    document.addEventListener('mouseup', onEnd);

    // ── Sparkles (rare) ──
    function spawnSparkles() {
      const colors = ['#ccff00', '#a8ff00', '#e8ff80', '#ffffff', '#b8ff40'];
      for (let i = 0; i < 28; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        const sz = Math.random() * 5 + 3;
        el.style.cssText = `
          width:${sz}px; height:${sz}px;
          top:${Math.random()*100}%; left:${Math.random()*100}%;
          --color:${colors[~~(Math.random()*colors.length)]};
          --dur:${1.2+Math.random()*1.4}s;
          --delay:${Math.random()*1.8}s;
          --tx:${(Math.random()-.5)*40}px;
          --ty:${(Math.random()-.5)*40}px;
        `;
        sparklesEl.appendChild(el);
      }
    }

    // ── Save ──
    function drawCanvas() {
      const { cardNum, isRare } = cardData;
      const cvs = document.createElement('canvas');
      cvs.width = 600; cvs.height = 840;
      const ctx = cvs.getContext('2d');
      const cx=20, cy=20, cw=560, ch=800, r=28;

      function rr(x,y,w,h,rv) {
        ctx.beginPath();
        ctx.moveTo(x+rv,y); ctx.lineTo(x+w-rv,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rv);
        ctx.lineTo(x+w,y+h-rv); ctx.quadraticCurveTo(x+w,y+h,x+w-rv,y+h);
        ctx.lineTo(x+rv,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rv);
        ctx.lineTo(x,y+rv); ctx.quadraticCurveTo(x,y,x+rv,y); ctx.closePath();
      }

      // White bg
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,600,840);

      // Card bg
      ctx.fillStyle = '#ffffff'; rr(cx,cy,cw,ch,r); ctx.fill();

      // Card border
      ctx.strokeStyle = isRare ? '#ccff00' : '#1a1a1a';
      ctx.lineWidth = isRare ? 3 : 1.5;
      rr(cx,cy,cw,ch,r); ctx.stroke();

      // Rare outer glow
      if (isRare) {
        ctx.shadowColor = '#ccff00'; ctx.shadowBlur = 20;
        rr(cx,cy,cw,ch,r); ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Top accent line
      ctx.fillStyle = isRare ? '#ccff00' : '#e0e0e0';
      ctx.fillRect(cx, cy, cw, 5);

      // Artwork area
      const ax=cx+24, ay=cy+72, aw=cw-48, ah=560;
      ctx.fillStyle = '#f4f4f4'; rr(ax,ay,aw,ah,12); ctx.fill();

      // Art number
      ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.font = 'bold 140px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(cardNum, ax+aw/2, ay+ah/2);

      ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.font = '26px Arial';
      ctx.fillText('작품 준비 중', ax+aw/2, ay+ah/2+90);

      // Card number
      ctx.fillStyle = '#999999'; ctx.font = '600 20px Arial'; ctx.textAlign = 'left';
      ctx.fillText(`#${String(cardNum).padStart(3,'0')}`, cx+32, cy+48);

      // Rare badge
      if (isRare) {
        ctx.fillStyle = '#ccff00'; ctx.fillRect(cx+cw-120, cy+30, 88, 28);
        ctx.fillStyle = '#0a0a0a'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('RARE', cx+cw-76, cy+44);
      }

      // Title
      ctx.fillStyle = '#0a0a0a'; ctx.font = 'bold 30px Arial'; ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(`작품 ${cardNum}`, cx+cw/2, cy+ch-75);

      ctx.fillStyle = '#999'; ctx.font = '18px Arial';
      ctx.fillText(isRare ? 'RARE — 카드깡 컬렉션 · 2026' : '카드깡 컬렉션 · 2026', cx+cw/2, cy+ch-44);

      // Corners
      ctx.strokeStyle = isRare ? '#ccff00' : '#e0e0e0'; ctx.lineWidth = 1.5;
      [[cx+12,cy+12,1,1],[cx+cw-12,cy+12,-1,1],[cx+12,cy+ch-12,1,-1],[cx+cw-12,cy+ch-12,-1,-1]].forEach(([x,y,dx,dy])=>{
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+22*dx,y); ctx.moveTo(x,y); ctx.lineTo(x,y+22*dy); ctx.stroke();
      });

      return cvs;
    }

    async function saveCard() {
      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = '저장 중...';
      try {
        const cvs = drawCanvas();
        if (navigator.share && navigator.canShare) {
          cvs.toBlob(async blob => {
            const f = new File([blob], `card_${cardData.cardNum}${cardData.isRare?'_rare':''}.png`, {type:'image/png'});
            if (navigator.canShare({files:[f]})) {
              try { await navigator.share({files:[f], title:`카드깡 - 작품 ${cardData.cardNum}`}); showToast('저장 완료'); }
              catch(e) { if (e.name !== 'AbortError') fallbackDl(cvs); }
            } else { fallbackDl(cvs); }
            btn.disabled = false; btn.textContent = '갤러리에 저장';
          });
        } else {
          fallbackDl(cvs);
          btn.disabled = false; btn.textContent = '갤러리에 저장';
        }
      } catch { btn.disabled = false; btn.textContent = '갤러리에 저장'; showToast('저장 실패. 다시 시도해주세요.'); }
    }

    function fallbackDl(cvs) {
      const a = document.createElement('a');
      a.download = `card_${cardData.cardNum}${cardData.isRare?'_rare':''}.png`;
      a.href = cvs.toDataURL('image/png'); a.click();
      showToast('이미지 저장됨');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function showError(msg) {
      scrLoading.classList.add('gone');
      scrError.classList.remove('gone');
      document.getElementById('errMsg').textContent = msg;
    }

    // ── Init ──
    function init() {
      const p = new URLSearchParams(window.location.search);
      const tokenStr = p.get('t');
      const isPreview = p.get('preview') === '1';
      let cardNum, isRare;

      if (tokenStr) {
        const data = parseToken(tokenStr);
        if (data && (isPreview || Date.now() - data.ts <= EXPIRE_MS)) {
          cardNum = data.cardNum; isRare = data.isRare;
        }
      }

      if (!cardNum) {
        cardNum = Math.floor(Math.random() * 15) + 1;
        isRare = Math.random() < 1 / 50;
      }

      scrLoading.classList.add('gone');
      scrMain.classList.remove('gone');
      setupCard(cardNum, isRare);

      if (isPreview) {
        packWrap.style.display = 'none';
        dragHint.style.display = 'none';
        cardContainer.style.opacity = '1';
        cardContainer.style.transform = 'scale(1) translateY(0)';
        tearDone = true;
        setTimeout(() => {
          cardFlipper.classList.add('flipped');
          if (isRare) setTimeout(spawnSparkles, 640);
          setTimeout(() => actionBtns.classList.remove('gone'), 880);
        }, 300);
      }
    }

    init();
  </script>
</body>
</html>
