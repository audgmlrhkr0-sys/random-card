<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카드깡</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --accent: #ccff00;
      --bg: #ffffff;
      --surface: #f4f4f4;
      --border: #1a1a1a;
      --border-light: #e0e0e0;
      --text: #0a0a0a;
      --muted: #999999;
      --font: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 420px;
    }

    /* Header */
    .header { text-align: center; }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    /* Accent dot */
    .header h1 span {
      display: inline-block;
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
      margin-bottom: 4px;
    }

    .header p {
      margin-top: 6px;
      font-size: 0.84rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    /* QR frame */
    .qr-wrap {
      position: relative;
      width: 280px;
      height: 280px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Green top accent on QR frame */
    .qr-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }

    #qrCanvas { border-radius: 8px; }

    .qr-loading {
      position: absolute;
      inset: 0;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Buttons */
    .btn-primary {
      width: 280px;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      letter-spacing: 0.03em;
      text-align: center;
      text-decoration: none;
      display: block;
      transition: opacity 0.15s;
    }

    .btn-primary:hover { opacity: 0.88; }

    /* Divider */
    .divider {
      width: 280px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }

    /* Test section */
    .test-section {
      width: 280px;
      border: 1.5px solid var(--border-light);
      border-radius: 12px;
      padding: 14px;
      background: var(--surface);
    }

    .test-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-test {
      padding: 8px 4px;
      background: #fff;
      border: 1.5px solid var(--border-light);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.74rem;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.13s, background 0.13s;
    }

    .btn-test:hover { border-color: var(--border); background: var(--surface); }

    .btn-test.rare {
      border-color: var(--accent);
      background: rgba(204,255,0,0.08);
      color: var(--text);
      font-weight: 700;
      grid-column: span 3;
      letter-spacing: 0.04em;
    }

    .btn-test.rare:hover { background: rgba(204,255,0,0.18); }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>카드깡<span></span></h1>
      <p>QR 코드를 스캔하면 카드를 뽑을 수 있습니다</p>
    </div>

    <div class="qr-wrap">
      <div class="qr-loading" id="qrLoading"><div class="spinner"></div></div>
      <canvas id="qrCanvas" width="256" height="256" style="display:none"></canvas>
    </div>

    <a class="btn-primary" href="./card.html" target="_blank">같은 기기에서 열기</a>

    <div class="divider">테스트용 미리보기</div>

    <div class="test-section">
      <div class="test-label">임시 확인용</div>
      <div class="test-grid" id="testGrid"></div>
    </div>

  </div>

  <script>
    const BASE = 'https://audgmlrhkr0-sys.github.io/random-card';
    const SECRET = 'cgk26_9qM_rnd';

    function simpleHash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function makeToken(cardNum, isRare) {
      const ts = Date.now();
      const payload = `${cardNum}:${isRare ? 1 : 0}:${ts}`;
      const sig = simpleHash(payload + SECRET);
      return btoa(payload + ':' + sig).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    }

    async function buildQR() {
      const cvs = document.getElementById('qrCanvas');
      const loading = document.getElementById('qrLoading');
      try {
        await QRCode.toCanvas(cvs, `${BASE}/card.html`, {
          width: 256, margin: 2,
          errorCorrectionLevel: 'M',
          color: { dark: '#1a1a1a', light: '#ffffff' }
        });
        cvs.style.display = 'block';
        loading.style.display = 'none';
      } catch {
        loading.innerHTML = '<p style="font-size:0.8rem;color:#999;padding:16px;text-align:center">QR 생성 실패</p>';
      }
    }

    function buildTestButtons() {
      const grid = document.getElementById('testGrid');
      for (let i = 1; i <= 15; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-test';
        btn.textContent = `카드 ${i}`;
        btn.onclick = () => window.open(`${BASE}/card.html?t=${makeToken(i, false)}&preview=1`, '_blank');
        grid.appendChild(btn);
      }
      const rare = document.createElement('button');
      rare.className = 'btn-test rare';
      rare.textContent = 'RARE 카드 확인';
      rare.onclick = () => window.open(`${BASE}/card.html?t=${makeToken(1, true)}&preview=1`, '_blank');
      grid.appendChild(rare);
    }

    buildQR();
    buildTestButtons();
  </script>
</body>
</html>
