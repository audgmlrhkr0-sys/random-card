<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>카드 뽑기 🎴</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      color: #fff;
    }

    /* radial glow bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(100,30,200,0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Error / Loading screens ── */
    .overlay-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 50;
      background: #0d0d1a;
    }

    .overlay-screen.gone { display: none; }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .err-icon { font-size: 3rem; }
    .err-msg {
      font-size: 1rem;
      font-weight: 700;
      color: #f87171;
      text-align: center;
      white-space: pre-line;
      line-height: 1.6;
      max-width: 260px;
    }

    .btn-close {
      margin-top: 6px;
      padding: 11px 28px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 11px;
      color: #cbd5e1;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Main stage ── */
    .main {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .main.gone { display: none; }

    /* ── Stage (perspective container) ── */
    .stage {
      position: relative;
      width: 260px;
      height: 380px;
      perspective: 900px;
    }

    /* ── Card behind pack ── */
    .card-container {
      position: absolute;
      inset: 0;
      opacity: 0;
      transform: scale(0.86) translateY(18px);
      pointer-events: none;
    }

    .card-flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-flipper.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    /* Card back */
    .c-back {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
      border: 2px solid rgba(129,140,248,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .c-back::after {
      content: '🎴';
      font-size: 3.2rem;
      filter: drop-shadow(0 0 20px rgba(192,132,252,0.7));
    }

    /* Card front */
    .c-front {
      transform: rotateY(180deg);
      overflow: hidden;
    }

    /* Normal card border animation */
    .card-border-normal {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 3px;
      background: linear-gradient(135deg, #a78bfa, #6366f1, #38bdf8, #a78bfa);
      background-size: 300% 300%;
      animation: bdRotate 4s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: destination-out;
    }

    @keyframes bdRotate {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 300%; }
    }

    /* Rare card border */
    .card-border-rare {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 3px;
      background: linear-gradient(135deg, #fbbf24, #ef4444, #ec4899, #8b5cf6, #06b6d4, #fbbf24);
      background-size: 400% 400%;
      animation: rainbowBd 2s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: destination-out;
      display: none;
    }

    @keyframes rainbowBd {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* Rare holo overlay */
    .rare-holo {
      position: absolute;
      inset: 3px;
      border-radius: 13px;
      background: linear-gradient(125deg, transparent 20%, rgba(255,255,255,0.04) 35%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 65%, transparent 80%);
      background-size: 200% 200%;
      animation: holoShift 3s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 5;
      display: none;
    }

    @keyframes holoShift {
      0% { background-position: 0% 0%; }
      100% { background-position: 100% 100%; }
    }

    /* Sparkles */
    .sparkles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 10;
    }

    .sparkle {
      position: absolute;
      border-radius: 50%;
      animation: sparkAnim var(--dur, 1.5s) ease-in-out var(--delay, 0s) infinite;
      background: var(--color, #fff);
      box-shadow: 0 0 6px var(--color, #fff);
    }

    @keyframes sparkAnim {
      0% { transform: scale(0); opacity: 0; }
      20% { opacity: 1; }
      50% { transform: scale(1) rotate(180deg); opacity: 0.8; }
      80% { opacity: 0.3; }
      100% { transform: scale(0) rotate(360deg) translate(var(--tx,0px), var(--ty,0px)); opacity: 0; }
    }

    /* Card content layout */
    .card-inner-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 13px;
      gap: 9px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; }

    .cn-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.4);
    }

    .rare-badge {
      padding: 2px 8px;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      border-radius: 5px;
      font-size: 0.66rem;
      font-weight: 800;
      color: #1a0a00;
      display: none;
      animation: badgeGlow 1.5s ease-in-out infinite alternate;
    }

    @keyframes badgeGlow {
      from { box-shadow: 0 0 6px rgba(251,191,36,0.5); }
      to { box-shadow: 0 0 18px rgba(251,191,36,0.9); }
    }

    .artwork-area {
      flex: 1;
      border-radius: 9px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .artwork-area img {
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .art-placeholder {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .art-num {
      font-size: 2.8rem;
      font-weight: 800;
      opacity: 0.13;
    }

    .art-lbl {
      font-size: 0.78rem;
      opacity: 0.4;
      letter-spacing: 0.04em;
    }

    .card-footer { padding: 3px 0 1px; }

    .card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-align: center;
    }

    .card-series {
      font-size: 0.67rem;
      color: rgba(255,255,255,0.32);
      text-align: center;
      margin-top: 2px;
    }

    .c-corner {
      position: absolute;
      width: 18px; height: 18px;
      z-index: 3;
    }

    .c-tl { top: 9px; left: 9px; border-top: 1.5px solid; border-left: 1.5px solid; border-radius: 3px 0 0 0; }
    .c-tr { top: 9px; right: 9px; border-top: 1.5px solid; border-right: 1.5px solid; border-radius: 0 3px 0 0; }
    .c-bl { bottom: 9px; left: 9px; border-bottom: 1.5px solid; border-left: 1.5px solid; border-radius: 0 0 0 3px; }
    .c-br { bottom: 9px; right: 9px; border-bottom: 1.5px solid; border-right: 1.5px solid; border-radius: 0 0 3px 0; }

    /* ── Pack ── */
    .pack-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    /* Floating animation when idle */
    .pack-wrap.floating {
      animation: packFloat 3s ease-in-out infinite;
    }

    @keyframes packFloat {
      0%, 100% { transform: translateY(0) rotate(-0.8deg); }
      50% { transform: translateY(-7px) rotate(0.8deg); }
    }

    /* Flap (top part that tears away) */
    .pack-flap {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 40%;
      transform-origin: center bottom;
      transform-style: preserve-3d;
      will-change: transform;
      cursor: grab;
    }

    .pack-flap:active { cursor: grabbing; }

    .flap-front, .flap-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 14px 14px 0 0;
      overflow: hidden;
    }

    .flap-front {
      background: linear-gradient(145deg, #2e0d62 0%, #1c0b40 55%, #10103a 100%);
      border: 2px solid rgba(140,70,230,0.55);
      border-bottom: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    /* Foil shimmer on flap */
    .flap-front::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(108deg, transparent 32%, rgba(255,255,255,0.06) 44%, rgba(255,255,255,0.13) 50%, rgba(255,255,255,0.06) 56%, transparent 68%);
      background-size: 200% 100%;
      animation: foilMove 2.4s ease-in-out infinite;
    }

    @keyframes foilMove {
      0% { background-position: -100% 0; }
      100% { background-position: 200% 0; }
    }

    /* Rainbow stripe on flap */
    .flap-front::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #c084fc, #818cf8, #38bdf8, #4ade80, #fbbf24, #f87171, #c084fc);
      background-size: 200% 100%;
      animation: stripeMove 2s linear infinite;
    }

    @keyframes stripeMove {
      0% { background-position: 0% 0; }
      100% { background-position: 200% 0; }
    }

    .flap-back {
      transform: rotateX(180deg);
      background: linear-gradient(to bottom, #180820, #0d0518);
      border: 2px solid rgba(100,40,180,0.3);
      border-bottom: none;
    }

    .pack-icon {
      font-size: 2rem;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 10px rgba(192,132,252,0.7));
    }

    .pack-name {
      position: relative;
      z-index: 1;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      color: rgba(210,170,255,0.95);
      text-shadow: 0 0 12px rgba(192,132,252,0.7);
    }

    /* Pack body (bottom part) */
    .pack-body {
      position: absolute;
      top: 40%;
      left: 0; right: 0; bottom: 0;
      background: linear-gradient(145deg, #1c0b40 0%, #10103a 55%, #0a0a22 100%);
      border-radius: 0 0 14px 14px;
      border: 2px solid rgba(140,70,230,0.55);
      border-top: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      overflow: hidden;
      will-change: transform, opacity;
    }

    .pack-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(108deg, transparent 32%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 55%, transparent 68%);
      background-size: 200% 100%;
      animation: foilMove 2.4s ease-in-out infinite 0.6s;
    }

    .body-brand {
      position: relative;
      z-index: 1;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: rgba(190,140,255,0.8);
    }

    .body-sub {
      position: relative;
      z-index: 1;
      font-size: 0.65rem;
      color: rgba(190,140,255,0.45);
      letter-spacing: 0.05em;
    }

    /* Tear line (perforated) */
    .tear-line {
      position: absolute;
      left: 0; right: 0;
      top: calc(40% - 1px);
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        rgba(160,100,255,0.9) 0, rgba(160,100,255,0.9) 5px,
        transparent 5px, transparent 11px
      );
      z-index: 20;
      pointer-events: none;
    }

    /* ── Drag hint ── */
    .drag-hint {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: rgba(148,163,184,0.65);
      font-size: 0.8rem;
      margin-top: 4px;
      transition: opacity 0.3s;
    }

    .hint-arrow {
      font-size: 1.5rem;
      animation: bounceUp 1.1s ease-in-out infinite;
    }

    @keyframes bounceUp {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-9px); opacity: 1; }
    }

    /* ── Action buttons ── */
    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 260px;
      transition: opacity 0.3s, transform 0.3s;
    }

    .action-btns.gone { display: none; }

    .btn-save {
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,58,237,0.5); }
    .btn-save:active { transform: translateY(0); }
    .btn-save:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .btn-retry {
      padding: 12px;
      background: transparent;
      border: 1px solid #334155;
      border-radius: 12px;
      color: #94a3b8;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-retry:hover { border-color: #64748b; color: #e2e8f0; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(14px);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 11px;
      padding: 11px 22px;
      font-size: 0.88rem;
      color: #4ade80;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Loading -->
  <div class="overlay-screen" id="scrLoading">
    <div class="spinner"></div>
  </div>

  <!-- Error -->
  <div class="overlay-screen gone" id="scrError">
    <div class="err-icon" id="errIcon">❌</div>
    <div class="err-msg" id="errMsg"></div>
    <button class="btn-close" onclick="window.close()">← 닫기</button>
  </div>

  <!-- Main -->
  <div class="main gone" id="scrMain">

    <!-- Stage (perspective applied here) -->
    <div class="stage" id="stage">

      <!-- Card (revealed after tear) -->
      <div class="card-container" id="cardContainer">
        <div class="card-flipper" id="cardFlipper">

          <!-- Back face -->
          <div class="card-face c-back"></div>

          <!-- Front face -->
          <div class="card-face c-front" id="cardFront">
            <div class="card-border-normal" id="normalBd"></div>
            <div class="card-border-rare" id="rareBd"></div>
            <div class="rare-holo" id="rareHolo"></div>
            <div class="sparkles" id="sparkles"></div>

            <div class="c-corner c-tl"></div>
            <div class="c-corner c-tr"></div>
            <div class="c-corner c-bl"></div>
            <div class="c-corner c-br"></div>

            <div class="card-inner-content">
              <div class="card-header">
                <span class="cn-label" id="cnLabel">#001</span>
                <span class="rare-badge" id="rareBadge">✨ RARE</span>
              </div>
              <div class="artwork-area" id="artworkArea">
                <div class="art-placeholder">
                  <div class="art-num" id="artNum">1</div>
                  <div class="art-lbl">작품 준비 중</div>
                </div>
              </div>
              <div class="card-footer">
                <div class="card-title" id="cardTitle">작품 1</div>
                <div class="card-series" id="cardSeries">카드깡 컬렉션 · 2026</div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Pack (on top of card) -->
      <div class="pack-wrap floating" id="packWrap">

        <!-- Flap -->
        <div class="pack-flap" id="packFlap">
          <div class="flap-front">
            <div class="pack-icon">🎴</div>
            <div class="pack-name">CARD GACHA</div>
          </div>
          <div class="flap-back"></div>
        </div>

        <!-- Body -->
        <div class="pack-body" id="packBody">
          <div class="body-brand">카드깡</div>
          <div class="body-sub">컬렉션 · 2026 · 15종</div>
        </div>

        <!-- Tear line -->
        <div class="tear-line" id="tearLine"></div>
      </div>

    </div><!-- /stage -->

    <!-- Drag hint -->
    <div class="drag-hint" id="dragHint">
      <div class="hint-arrow">↑</div>
      <span>위로 당겨서 뜯기</span>
    </div>

    <!-- Buttons (hidden until reveal) -->
    <div class="action-btns gone" id="actionBtns">
      <button class="btn-save" id="btnSave" onclick="saveCard()">📥 갤러리에 저장</button>
      <button class="btn-retry" onclick="location.reload()">🔄 다시 뽑기</button>
    </div>

  </div><!-- /main -->

  <div class="toast" id="toast"></div>

  <script>
    // ── Card data ──────────────────────────────────────────────
    const SECRET = 'cgk26_9qM_rnd';
    const EXPIRE_MS = 30000;

    const CARD_GRADIENTS = [
      ['#0f2027','#203a43','#2c5364'],
      ['#1a0533','#3a0551','#6b0080'],
      ['#0d1b2a','#1b4332','#2d6a4f'],
      ['#1a0a00','#4a1200','#7b2400'],
      ['#0a0e1a','#1a2040','#2a3a6a'],
      ['#0f0f23','#1a1a3e','#2d2d5e'],
      ['#0d2137','#0d4f6e','#1a7a9e'],
      ['#1a0a14','#3d0a2a','#6b1044'],
      ['#0a1a0a','#1a3d1a','#2a5e2a'],
      ['#1a1200','#3d2e00','#6b5000'],
      ['#0a0a1a','#1a0a3d','#300a6b'],
      ['#1a0a0a','#3d1a1a','#6b2a2a'],
      ['#0a1a14','#1a3d2e','#2a6b50'],
      ['#0f1a2e','#1e2d4e','#2e4066'],
      ['#1a1014','#3d202a','#6b3040'],
    ];

    function simpleHash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function parseToken(t) {
      try {
        const pad = t.length % 4;
        const decoded = atob((t + (pad ? '='.repeat(4 - pad) : '')).replace(/-/g,'+').replace(/_/g,'/'));
        const [cn, ir, ts, sig] = decoded.split(':');
        if (simpleHash(`${cn}:${ir}:${ts}` + SECRET) !== sig) return null;
        return { cardNum: parseInt(cn), isRare: ir === '1', ts: parseInt(ts) };
      } catch { return null; }
    }

    // ── State ──────────────────────────────────────────────────
    let cardData = null;
    let tearDone = false;
    let dragStartY = null;
    let isDragging = false;
    let currentProgress = 0;
    const DRAG_FULL = 160; // px for 100% tear

    // ── DOM refs ───────────────────────────────────────────────
    const scrLoading  = document.getElementById('scrLoading');
    const scrError    = document.getElementById('scrError');
    const scrMain     = document.getElementById('scrMain');
    const packWrap    = document.getElementById('packWrap');
    const packFlap    = document.getElementById('packFlap');
    const packBody    = document.getElementById('packBody');
    const tearLine    = document.getElementById('tearLine');
    const dragHint    = document.getElementById('dragHint');
    const cardContainer = document.getElementById('cardContainer');
    const cardFlipper = document.getElementById('cardFlipper');
    const cardFront   = document.getElementById('cardFront');
    const actionBtns  = document.getElementById('actionBtns');
    const sparklesEl  = document.getElementById('sparkles');

    // ── Setup card visuals ─────────────────────────────────────
    function setupCard(cardNum, isRare) {
      cardData = { cardNum, isRare };
      const [c1, c2, c3] = CARD_GRADIENTS[(cardNum - 1) % CARD_GRADIENTS.length];

      if (isRare) {
        cardFront.style.background = 'linear-gradient(135deg,#0a0510,#150a20,#0a1520)';
        document.getElementById('rareBd').style.display = 'block';
        document.getElementById('normalBd').style.display = 'none';
        document.getElementById('rareHolo').style.display = 'block';
        document.getElementById('rareBadge').style.display = 'block';
        document.getElementById('artNum').style.color = '#fbbf24';
        document.getElementById('cardSeries').style.color = '#fbbf24';
        document.getElementById('cardSeries').textContent = '✨ RARE 카드깡 컬렉션 · 2026';
        cardFront.querySelectorAll('.c-corner').forEach(c => c.style.borderColor = 'rgba(251,191,36,0.8)');
        document.getElementById('artworkArea').style.background = `linear-gradient(135deg,#0a0518cc,#100820cc)`;
      } else {
        cardFront.style.background = `linear-gradient(135deg,${c1},${c2},${c3})`;
        cardFront.querySelectorAll('.c-corner').forEach(c => c.style.borderColor = 'rgba(139,92,246,0.6)');
        document.getElementById('artworkArea').style.background = `linear-gradient(135deg,${c1}cc,${c3}cc)`;
      }

      document.getElementById('cnLabel').textContent = `#${String(cardNum).padStart(3,'0')}`;
      document.getElementById('artNum').textContent = cardNum;
      document.getElementById('cardTitle').textContent = `작품 ${cardNum}`;
    }

    // ── Tear mechanics ─────────────────────────────────────────
    function applyTear(p) {
      // Rotate flap backward
      const angle = p * 172;
      packFlap.style.transform = `rotateX(-${angle}deg)`;

      // Flap fades as it passes 75%
      packFlap.style.opacity = p > 0.72 ? String(1 - (p - 0.72) / 0.28) : '1';

      // Body slides down slightly and fades after 60%
      packBody.style.transform = `translateY(${p * 12}px)`;
      if (p > 0.55) {
        packBody.style.opacity = String(1 - (p - 0.55) / 0.45);
      }

      // Tear line fades
      tearLine.style.opacity = String(Math.max(0, 1 - p * 2));

      // Card appears from behind
      cardContainer.style.opacity = String(Math.min(1, p * 1.6));
      cardContainer.style.transform = `scale(${0.86 + p * 0.14}) translateY(${(1 - p) * 18}px)`;

      // Hint fades quickly
      dragHint.style.opacity = String(Math.max(0, 1 - p * 4));
    }

    function completeTear() {
      tearDone = true;
      packWrap.classList.remove('floating');

      // Flap flies away
      packFlap.style.transition = 'transform 0.48s ease-out, opacity 0.3s ease-out';
      packFlap.style.transform = 'rotateX(-195deg) translateY(-50px)';
      packFlap.style.opacity = '0';

      // Body drops away
      packBody.style.transition = 'transform 0.4s ease-in, opacity 0.32s ease-out';
      packBody.style.transform = 'translateY(90px) scale(0.94)';
      packBody.style.opacity = '0';

      tearLine.style.transition = 'opacity 0.2s';
      tearLine.style.opacity = '0';
      dragHint.style.opacity = '0';

      // Reveal card
      setTimeout(() => {
        cardContainer.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1), opacity 0.28s';
        cardContainer.style.opacity = '1';
        cardContainer.style.transform = 'scale(1) translateY(0)';

        // Auto-flip card face up
        setTimeout(() => {
          cardFlipper.classList.add('flipped');
          if (cardData.isRare) setTimeout(spawnSparkles, 650);
          setTimeout(() => {
            actionBtns.classList.remove('gone');
          }, 900);
        }, 480);
      }, 220);
    }

    function snapBack() {
      const dur = '0.42s cubic-bezier(0.34,1.56,0.64,1)';
      packFlap.style.transition = `transform ${dur}`;
      packFlap.style.transform = 'rotateX(0deg)';
      packFlap.style.opacity = '1';
      packBody.style.transition = `transform ${dur}, opacity ${dur}`;
      packBody.style.transform = 'translateY(0)';
      packBody.style.opacity = '1';
      tearLine.style.transition = 'opacity 0.3s';
      tearLine.style.opacity = '1';
      cardContainer.style.opacity = '0';
      cardContainer.style.transform = 'scale(0.86) translateY(18px)';
      dragHint.style.opacity = '1';
      currentProgress = 0;
      setTimeout(() => {
        packFlap.style.transition = '';
        packBody.style.transition = '';
        tearLine.style.transition = '';
      }, 450);
    }

    // ── Drag event handlers ────────────────────────────────────
    function onDragStart(y) {
      if (tearDone) return;
      dragStartY = y;
      isDragging = true;
      packWrap.classList.remove('floating');
    }

    function onDragMove(y) {
      if (!isDragging || tearDone) return;
      const dy = dragStartY - y;
      currentProgress = Math.max(0, Math.min(1, dy / DRAG_FULL));
      applyTear(currentProgress);
    }

    function onDragEnd() {
      if (!isDragging || tearDone) return;
      isDragging = false;
      if (currentProgress > 0.52) {
        completeTear();
      } else {
        packWrap.classList.add('floating');
        snapBack();
      }
    }

    // Touch
    document.addEventListener('touchstart', e => onDragStart(e.touches[0].clientY), { passive: true });
    document.addEventListener('touchmove', e => { e.preventDefault(); onDragMove(e.touches[0].clientY); }, { passive: false });
    document.addEventListener('touchend', onDragEnd);

    // Mouse
    document.addEventListener('mousedown', e => onDragStart(e.clientY));
    document.addEventListener('mousemove', e => onDragMove(e.clientY));
    document.addEventListener('mouseup', onDragEnd);

    // ── Sparkles ───────────────────────────────────────────────
    function spawnSparkles() {
      const colors = ['#fbbf24','#f59e0b','#fff','#fde68a','#ef4444','#ec4899'];
      for (let i = 0; i < 30; i++) {
        const el = document.createElement('div');
        el.className = 'sparkle';
        const sz = Math.random() * 6 + 3;
        el.style.cssText = `
          width:${sz}px; height:${sz}px;
          top:${Math.random()*100}%; left:${Math.random()*100}%;
          --color:${colors[~~(Math.random()*colors.length)]};
          --dur:${1.2+Math.random()*1.6}s;
          --delay:${Math.random()*2}s;
          --tx:${(Math.random()-.5)*44}px;
          --ty:${(Math.random()-.5)*44}px;
        `;
        sparklesEl.appendChild(el);
      }
    }

    // ── Save card ──────────────────────────────────────────────
    function drawCanvas() {
      const { cardNum, isRare } = cardData;
      const cvs = document.createElement('canvas');
      cvs.width = 600; cvs.height = 840;
      const ctx = cvs.getContext('2d');
      const [c1, c2, c3] = CARD_GRADIENTS[(cardNum - 1) % CARD_GRADIENTS.length];
      const cx=20, cy=20, cw=560, ch=800, r=32;

      function rr(x,y,w,h,rr) {
        ctx.beginPath();
        ctx.moveTo(x+rr,y);
        ctx.lineTo(x+w-rr,y); ctx.quadraticCurveTo(x+w,y,x+w,y+rr);
        ctx.lineTo(x+w,y+h-rr); ctx.quadraticCurveTo(x+w,y+h,x+w-rr,y+h);
        ctx.lineTo(x+rr,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-rr);
        ctx.lineTo(x,y+rr); ctx.quadraticCurveTo(x,y,x+rr,y);
        ctx.closePath();
      }

      ctx.fillStyle='#0d0d1a'; ctx.fillRect(0,0,600,840);

      const bg = ctx.createLinearGradient(cx,cy,cx+cw,cy+ch);
      if (isRare) { bg.addColorStop(0,'#0a0510'); bg.addColorStop(.5,'#150a20'); bg.addColorStop(1,'#0a1520'); }
      else { bg.addColorStop(0,c1); bg.addColorStop(.5,c2); bg.addColorStop(1,c3); }
      ctx.fillStyle=bg; rr(cx,cy,cw,ch,r); ctx.fill();

      const bd = ctx.createLinearGradient(cx,cy,cx+cw,cy+ch);
      if (isRare) { bd.addColorStop(0,'#fbbf24'); bd.addColorStop(.4,'#ef4444'); bd.addColorStop(.8,'#8b5cf6'); bd.addColorStop(1,'#fbbf24'); }
      else { bd.addColorStop(0,'#a78bfa'); bd.addColorStop(.5,'#6366f1'); bd.addColorStop(1,'#38bdf8'); }
      ctx.strokeStyle=bd; ctx.lineWidth=isRare?5:4; rr(cx,cy,cw,ch,r); ctx.stroke();

      const ax=cx+28,ay=cy+80,aw=cw-56,ah=560;
      const ag=ctx.createLinearGradient(ax,ay,ax+aw,ay+ah);
      ag.addColorStop(0,isRare?'#0a0518':c1+'cc'); ag.addColorStop(1,isRare?'#100820':c3+'cc');
      ctx.fillStyle=ag; rr(ax,ay,aw,ah,16); ctx.fill();

      ctx.fillStyle=isRare?'rgba(251,191,36,0.12)':'rgba(255,255,255,0.07)';
      ctx.font='bold 140px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(cardNum,ax+aw/2,ay+ah/2);

      ctx.fillStyle=isRare?'rgba(251,191,36,0.35)':'rgba(255,255,255,0.22)';
      ctx.font='28px Arial'; ctx.fillText('작품 준비 중',ax+aw/2,ay+ah/2+90);

      ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.font='22px Arial'; ctx.textAlign='left';
      ctx.fillText(`#${String(cardNum).padStart(3,'0')}`,cx+32,cy+48);
      if (isRare) { ctx.fillStyle='#fbbf24'; ctx.font='bold 22px Arial'; ctx.textAlign='right'; ctx.fillText('✨ RARE',cx+cw-32,cy+48); }

      ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font='bold 32px Arial'; ctx.textAlign='center';
      ctx.fillText(`작품 ${cardNum}`,cx+cw/2,cy+ch-80);
      ctx.fillStyle=isRare?'#fbbf24':'rgba(255,255,255,0.3)'; ctx.font='20px Arial';
      ctx.fillText(isRare?'✨ RARE 카드깡 컬렉션 · 2026':'카드깡 컬렉션 · 2026',cx+cw/2,cy+ch-44);

      ctx.strokeStyle=isRare?'rgba(251,191,36,0.7)':'rgba(139,92,246,0.6)'; ctx.lineWidth=3;
      [[cx+14,cy+14,1,1],[cx+cw-14,cy+14,-1,1],[cx+14,cy+ch-14,1,-1],[cx+cw-14,cy+ch-14,-1,-1]].forEach(([x,y,dx,dy])=>{
        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+28*dx,y); ctx.moveTo(x,y); ctx.lineTo(x,y+28*dy); ctx.stroke();
      });
      return cvs;
    }

    async function saveCard() {
      const btn = document.getElementById('btnSave');
      btn.disabled = true; btn.textContent = '저장 중...';
      try {
        const cvs = drawCanvas();
        if (navigator.share && navigator.canShare) {
          cvs.toBlob(async blob => {
            const f = new File([blob], `card_${cardData.cardNum}${cardData.isRare?'_rare':''}.png`, {type:'image/png'});
            if (navigator.canShare({files:[f]})) {
              try { await navigator.share({files:[f], title:`카드깡 - 작품 ${cardData.cardNum}`}); showToast('✅ 저장 완료!'); }
              catch(e) { if (e.name!=='AbortError') fallbackDl(cvs); }
            } else { fallbackDl(cvs); }
            btn.disabled=false; btn.textContent='📥 갤러리에 저장';
          });
        } else {
          fallbackDl(cvs);
          btn.disabled=false; btn.textContent='📥 갤러리에 저장';
        }
      } catch { btn.disabled=false; btn.textContent='📥 갤러리에 저장'; showToast('저장 실패. 다시 시도해주세요.'); }
    }

    function fallbackDl(cvs) {
      const a = document.createElement('a');
      a.download = `card_${cardData.cardNum}${cardData.isRare?'_rare':''}.png`;
      a.href = cvs.toDataURL('image/png'); a.click();
      showToast('✅ 이미지 저장됨!');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }

    function showError(icon, msg) {
      scrLoading.classList.add('gone');
      scrError.classList.remove('gone');
      document.getElementById('errIcon').textContent = icon;
      document.getElementById('errMsg').textContent = msg;
    }

    // ── Init ───────────────────────────────────────────────────
    function init() {
      const p = new URLSearchParams(window.location.search);
      const tokenStr = p.get('t');
      const isPreview = p.get('preview') === '1';
      let cardNum, isRare;

      if (tokenStr) {
        const data = parseToken(tokenStr);
        if (data && (isPreview || Date.now() - data.ts <= EXPIRE_MS)) {
          cardNum = data.cardNum;
          isRare = data.isRare;
        }
      }

      // Fallback to random (refresh behavior)
      if (!cardNum) {
        cardNum = Math.floor(Math.random() * 15) + 1;
        isRare = Math.random() < 1 / 50;
      }

      scrLoading.classList.add('gone');
      scrMain.classList.remove('gone');
      setupCard(cardNum, isRare);

      // Preview: skip tear, auto-flip
      if (isPreview) {
        packWrap.style.display = 'none';
        dragHint.style.display = 'none';
        cardContainer.style.opacity = '1';
        cardContainer.style.transform = 'scale(1) translateY(0)';
        tearDone = true;
        setTimeout(() => {
          cardFlipper.classList.add('flipped');
          if (isRare) setTimeout(spawnSparkles, 650);
          setTimeout(() => actionBtns.classList.remove('gone'), 900);
        }, 300);
      }
    }

    init();
  </script>
</body>
