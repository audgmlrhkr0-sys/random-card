<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카드깡 🎴</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0d0d1a;
      color: #fff;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(88,28,135,0.13) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(30,58,138,0.13) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      padding: 40px 20px;
      width: 100%;
      max-width: 480px;
    }

    .title h1 {
      font-size: 2.1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .title p {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 0.88rem;
      text-align: center;
    }

    /* QR frame */
    .qr-frame {
      position: relative;
      width: 280px;
      height: 280px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-frame::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8, #c084fc);
      background-size: 300% 300%;
      border-radius: 19px;
      z-index: -1;
      animation: bdGlow 3s ease infinite;
    }

    @keyframes bdGlow {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    #qrCanvas { border-radius: 10px; }

    .qr-loading {
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scan button */
    .btn-scan {
      width: 280px;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-scan:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,58,237,0.5); }
    .btn-scan:active { transform: translateY(0); }

    /* Divider */
    .divider {
      width: 280px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #475569;
      font-size: 0.76rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1e293b;
    }

    /* Test section */
    .test-section {
      width: 280px;
      background: rgba(30,41,59,0.5);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 15px;
    }

    .test-label {
      font-size: 0.71rem;
      color: #f59e0b;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 11px;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .btn-test {
      padding: 8px 5px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.13s;
      text-align: center;
    }

    .btn-test:hover { border-color: #818cf8; color: #fff; background: #1e293b; }

    .btn-test.rare {
      border-color: #f59e0b;
      color: #fbbf24;
      background: rgba(245,158,11,0.09);
      grid-column: span 3;
    }

    .btn-test.rare:hover { background: rgba(245,158,11,0.18); }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <h1>🎴 카드깡</h1>
      <p>QR 코드를 폰으로 스캔하면 카드를 뽑을 수 있어요</p>
    </div>

    <div class="qr-frame">
      <div class="qr-loading" id="qrLoading"><div class="spinner"></div></div>
      <canvas id="qrCanvas" width="260" height="260" style="display:none"></canvas>
    </div>

    <a class="btn-scan" href="./card.html" target="_blank">
      📱 같은 기기에서 열기
    </a>

    <div class="divider">테스트용 미리보기</div>

    <div class="test-section">
      <div class="test-label">⚠️ 임시 확인용 (나중에 제거)</div>
      <div class="test-grid" id="testGrid"></div>
    </div>
  </div>

  <script>
    const BASE = 'https://audgmlrhkr0-sys.github.io/random-card';
    const SECRET = 'cgk26_9qM_rnd';

    function simpleHash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function makePreviewToken(cardNum, isRare) {
      const ts = Date.now();
      const payload = `${cardNum}:${isRare ? 1 : 0}:${ts}`;
      const sig = simpleHash(payload + SECRET);
      return btoa(payload + ':' + sig).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    }

    async function buildQR() {
      const cvs = document.getElementById('qrCanvas');
      const loading = document.getElementById('qrLoading');
      try {
        // QR just points to card.html — randomness happens on load
        await QRCode.toCanvas(cvs, `${BASE}/card.html`, {
          width: 260,
          margin: 2,
          errorCorrectionLevel: 'M',
          color: { dark: '#1a1a2e', light: '#ffffff' }
        });
        cvs.style.display = 'block';
        loading.style.display = 'none';
      } catch (e) {
        loading.innerHTML = '<p style="color:#f87171;font-size:0.8rem;padding:16px;text-align:center">QR 생성 실패</p>';
      }
    }

    function buildTestButtons() {
      const grid = document.getElementById('testGrid');
      for (let i = 1; i <= 15; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-test';
        btn.textContent = `카드 ${i}`;
        btn.onclick = () => {
          const t = makePreviewToken(i, false);
          window.open(`${BASE}/card.html?t=${t}&preview=1`, '_blank');
        };
        grid.appendChild(btn);
      }
      const rare = document.createElement('button');
      rare.className = 'btn-test rare';
      rare.textContent = '✨ 레어 카드 확인';
      rare.onclick = () => {
        const t = makePreviewToken(1, true);
        window.open(`${BASE}/card.html?t=${t}&preview=1`, '_blank');
      };
      grid.appendChild(rare);
    }

    buildQR();
    buildTestButtons();
  </script>
</body>
</html>
