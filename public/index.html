<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카드깡 🎴</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0d0d1a;
      color: #fff;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(88,28,135,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(30,58,138,0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 40px 20px;
      width: 100%;
      max-width: 500px;
    }

    .title h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;
    }

    .title p {
      margin-top: 6px;
      color: #94a3b8;
      font-size: 0.9rem;
      text-align: center;
    }

    /* QR 영역 */
    .qr-frame {
      position: relative;
      width: 280px;
      height: 280px;
      background: #fff;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }

    .qr-frame::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(135deg, #c084fc, #818cf8, #38bdf8, #c084fc);
      background-size: 300% 300%;
      border-radius: 19px;
      z-index: -1;
      animation: borderGlow 3s ease infinite;
    }

    @keyframes borderGlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    #qrCanvas {
      border-radius: 10px;
    }

    .qr-expired {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.88);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .qr-expired.show {
      opacity: 1;
      pointer-events: auto;
    }

    .qr-expired .icon { font-size: 2.5rem; }
    .qr-expired p { color: #f87171; font-size: 1rem; font-weight: 600; }

    /* 타이머 */
    .timer-bar-wrap { width: 280px; }

    .timer-text {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .timer-label { font-size: 0.78rem; color: #94a3b8; }

    .timer-count {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .timer-count.ok { color: #4ade80; }
    .timer-count.warn { color: #fbbf24; }
    .timer-count.urgent { color: #f87171; }

    .timer-bar {
      height: 6px;
      background: #1e293b;
      border-radius: 99px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1s linear, background 0.5s;
      background: linear-gradient(90deg, #818cf8, #c084fc);
    }

    /* 버튼 */
    .btn-refresh {
      width: 280px;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-refresh:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,58,237,0.5); }
    .btn-refresh:active { transform: translateY(0); }

    /* 구분선 */
    .divider {
      width: 280px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #475569;
      font-size: 0.78rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #1e293b;
    }

    /* 테스트 섹션 */
    .test-section {
      width: 280px;
      background: rgba(30,41,59,0.6);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
    }

    .test-label {
      font-size: 0.72rem;
      color: #f59e0b;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .btn-test {
      padding: 9px 6px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }

    .btn-test:hover { border-color: #818cf8; color: #fff; background: #1e293b; }

    .btn-test.rare {
      border-color: #f59e0b;
      color: #fbbf24;
      background: rgba(245,158,11,0.1);
      grid-column: span 3;
    }

    .btn-test.rare:hover { background: rgba(245,158,11,0.2); }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">
      <h1>🎴 카드깡</h1>
      <p>QR 코드를 폰으로 스캔해서 카드를 뽑아보세요</p>
    </div>

    <div class="qr-frame">
      <canvas id="qrCanvas" width="260" height="260"></canvas>
      <div class="qr-expired" id="qrExpired">
        <div class="icon">⏰</div>
        <p>QR 코드 만료됨</p>
      </div>
    </div>

    <div class="timer-bar-wrap">
      <div class="timer-text">
        <span class="timer-label">남은 시간</span>
        <span class="timer-count ok" id="timerCount">30</span>
      </div>
      <div class="timer-bar">
        <div class="timer-fill" id="timerFill" style="width:100%"></div>
      </div>
    </div>

    <button class="btn-refresh" onclick="generateQR()">🔄 새로 뽑기</button>

    <div class="divider">테스트용 미리보기</div>

    <div class="test-section">
      <div class="test-label">⚠️ 임시 확인용 (나중에 제거)</div>
      <div class="test-grid" id="testGrid"></div>
    </div>
  </div>

  <script>
    const BASE_URL = 'https://audgmlrhkr0-sys.github.io/random-card';
    const SECRET = 'cgk26_9qM_rnd';
    const EXPIRE_MS = 30000;

    // 간단한 해시 함수
    function simpleHash(str) {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ c, 2654435761);
        h2 = Math.imul(h2 ^ c, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
    }

    function makeToken(cardNum, isRare) {
      const ts = Date.now();
      const payload = `${cardNum}:${isRare ? 1 : 0}:${ts}`;
      const sig = simpleHash(payload + SECRET);
      const raw = payload + ':' + sig;
      return btoa(raw).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
    }

    let timerInterval = null;
    let expiresAt = null;

    async function generateQR() {
      clearInterval(timerInterval);

      const cardNum = Math.floor(Math.random() * 15) + 1;
      const isRare = Math.random() < 1 / 50;
      const token = makeToken(cardNum, isRare);
      const url = `${BASE_URL}/card.html?t=${token}`;

      expiresAt = Date.now() + EXPIRE_MS;

      document.getElementById('qrExpired').classList.remove('show');
      document.getElementById('timerCount').textContent = '30';
      document.getElementById('timerCount').className = 'timer-count ok';
      document.getElementById('timerFill').style.width = '100%';
      document.getElementById('timerFill').style.background = 'linear-gradient(90deg, #818cf8, #c084fc)';

      const canvas = document.getElementById('qrCanvas');
      await QRCode.toCanvas(canvas, url, {
        width: 260,
        margin: 2,
        errorCorrectionLevel: 'M',
        color: { dark: '#1a1a2e', light: '#ffffff' }
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const remaining = Math.max(0, expiresAt - Date.now());
        const secs = Math.ceil(remaining / 1000);
        const pct = (remaining / EXPIRE_MS) * 100;

        const countEl = document.getElementById('timerCount');
        const fillEl = document.getElementById('timerFill');

        countEl.textContent = secs;
        fillEl.style.width = pct + '%';

        if (secs <= 10) {
          countEl.className = 'timer-count urgent';
          fillEl.style.background = 'linear-gradient(90deg, #ef4444, #f97316)';
        } else if (secs <= 20) {
          countEl.className = 'timer-count warn';
          fillEl.style.background = 'linear-gradient(90deg, #f59e0b, #eab308)';
        }

        if (remaining <= 0) {
          clearInterval(timerInterval);
          document.getElementById('qrExpired').classList.add('show');
        }
      }, 200);
    }

    function buildTestButtons() {
      const grid = document.getElementById('testGrid');
      for (let i = 1; i <= 15; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-test';
        btn.textContent = `카드 ${i}`;
        btn.onclick = () => {
          const token = makeToken(i, false);
          window.open(`${BASE_URL}/card.html?t=${token}&preview=1`, '_blank');
        };
        grid.appendChild(btn);
      }
      const rareBtn = document.createElement('button');
      rareBtn.className = 'btn-test rare';
      rareBtn.textContent = '✨ 레어 카드 확인';
      rareBtn.onclick = () => {
        const token = makeToken(1, true);
        window.open(`${BASE_URL}/card.html?t=${token}&preview=1`, '_blank');
      };
      grid.appendChild(rareBtn);
    }

    buildTestButtons();
    generateQR();
  </script>
</body>
</html>
