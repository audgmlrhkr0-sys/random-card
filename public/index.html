<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>카드깡</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --accent: #ccff00;
      --text: #0a0a0a;
      --muted: #888;
      --font: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #ededeb;
      background-image:
        radial-gradient(circle at 12% 18%, rgba(204,255,0,0.13) 0%, transparent 38%),
        radial-gradient(circle at 88% 82%, rgba(160,180,255,0.1) 0%, transparent 38%);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      width: 100%;
      max-width: 420px;
    }

    /* Header */
    .header { text-align: center; }

    .header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .header h1 em {
      display: inline-block;
      width: 9px; height: 9px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: 3px;
      vertical-align: middle;
      margin-bottom: 5px;
      font-style: normal;
    }

    .header p {
      margin-top: 6px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* QR frame (glass) */
    .qr-wrap {
      position: relative;
      width: 280px; height: 280px;
      border-radius: 18px;
      background: rgba(255,255,255,0.65);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      backdrop-filter: blur(20px) saturate(150%);
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 4px 28px rgba(0,0,0,0.08), inset 0 1px 0 rgba(255,255,255,1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Green top accent */
    .qr-wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      z-index: 1;
    }

    #qrCanvas { border-radius: 10px; }

    .qr-loading {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spinner {
      width: 26px; height: 26px;
      border: 2px solid rgba(0,0,0,0.08);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Primary button */
    .btn-primary {
      width: 280px;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: var(--text);
      font: 700 0.9rem/1 var(--font);
      cursor: pointer;
      letter-spacing: 0.03em;
      text-align: center;
      text-decoration: none;
      display: block;
      box-shadow: 0 4px 20px rgba(204,255,0,0.3);
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }

    /* Divider */
    .divider {
      width: 280px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(0,0,0,0.3);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(0,0,0,0.1);
    }

    /* Test section (glass) */
    .test-section {
      width: 280px;
      background: rgba(255,255,255,0.55);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.85);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.05);
    }

    .test-label {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: rgba(0,0,0,0.35);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn-test {
      padding: 8px 4px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      color: rgba(0,0,0,0.65);
      font: 500 0.72rem/1 var(--font);
      cursor: pointer;
      text-align: center;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn-test:hover { background: rgba(255,255,255,0.9); border-color: rgba(0,0,0,0.16); }

    .btn-test.rare {
      border-color: rgba(204,255,0,0.5);
      background: rgba(204,255,0,0.1);
      color: rgba(0,0,0,0.7);
      font-weight: 700;
      grid-column: span 3;
      letter-spacing: 0.04em;
    }
    .btn-test.rare:hover { background: rgba(204,255,0,0.2); }

    /* All-cards check overlay */
    .check-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(237,237,235,0.95);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      z-index: 100;
      overflow-y: auto;
      padding: 20px 16px 40px;
    }
    .check-overlay.open { display: block; }

    .check-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      position: sticky;
      top: 0;
      background: rgba(237,237,235,0.92);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      padding: 8px 0;
      z-index: 10;
    }

    .check-title {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .btn-close-check {
      padding: 7px 16px;
      background: var(--text);
      border: none;
      border-radius: 8px;
      color: #fff;
      font: 600 0.78rem/1 var(--font);
      cursor: pointer;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .check-card {
      background: rgba(255,255,255,0.65);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.88);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .check-num {
      background: var(--text);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 700;
      padding: 3px 8px;
      letter-spacing: 0.08em;
    }

    .check-img-wrap {
      background: rgba(244,244,242,0.9);
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .check-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .check-info {
      padding: 8px 8px 10px;
    }

    .check-info-title {
      font-size: 0.65rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .check-info-cap {
      font-size: 0.55rem;
      color: rgba(0,0,0,0.45);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>카드깡<em></em></h1>
      <p>QR 코드를 스캔하면 카드를 뽑을 수 있습니다</p>
    </div>

    <div class="qr-wrap">
      <div class="qr-loading" id="qrLoading"><div class="spinner"></div></div>
      <canvas id="qrCanvas" width="256" height="256" style="display:none"></canvas>
    </div>

    <a class="btn-primary" href="./card.html" target="_blank">같은 기기에서 열기</a>

    <div class="divider">테스트용 미리보기</div>

    <div class="test-section">
      <div class="test-label">임시 확인용</div>
      <div class="test-grid" id="testGrid"></div>
    </div>

  </div>

  <!-- All-cards check overlay -->
  <div class="check-overlay" id="checkOverlay">
    <div class="check-header">
      <span class="check-title">전체 카드 순서 확인</span>
      <button class="btn-close-check" onclick="document.getElementById('checkOverlay').classList.remove('open')">닫기</button>
    </div>
    <div class="check-grid" id="checkGrid"></div>
  </div>

  <script>
    const BASE    = 'https://audgmlrhkr0-sys.github.io/random-card';
    const SECRET  = 'cgk26_9qM_rnd';
    const CARD_COUNT = 19;
    const IMG_BASE = './images/';

    const CARD_DATA = [
      null,
      { title:'〈Face of Face-#3〉', cap:'천경우, 2016' },
      { title:'〈Face of Face-#1〉', cap:'천경우, 2016' },
      { title:'〈Face of Face-#5〉', cap:'천경우, 2016' },
      { title:'〈공동고백〉', cap:'고등어, 2021' },
      { title:'〈Gestures in the Subway 3-39〉', cap:'권순관, 2009' },
      { title:'〈Ruler No. 0〉', cap:'김승주, 2012' },
      { title:'〈유령과 바다, 그리고 뫼비우스〉', cap:'김우진, 2022' },
      { title:'〈빨간내복 20097〉', cap:'김정우, 2009' },
      { title:'〈부동산적 풍경화 #2〉', cap:'김지은, 2004' },
      { title:'〈Destroyer/Protector〉', cap:'남진우, 2022' },
      { title:'〈뇌〉', cap:'김승영, 2020' },
      { title:'〈Hollow Show-Night Life〉', cap:'문소현, 2018-2019' },
      { title:'〈에너지 드링크가 필요한 사회〉', cap:'박소라, 2023' },
      { title:'〈터뷸런스〉', cap:'장서영, 2024' },
      { title:'〈CPR Board B〉', cap:'잭슨홍, 2008' },
      { title:'〈Only.Love.gr.pu〉', cap:'정세인, 2022' },
      { title:'〈숲속 생활연구소〉', cap:'최병석, 2015' },
      { title:'〈숲속 생활연구소〉', cap:'최병석, 2015' },
      { title:'〈숲속 생활연구소〉', cap:'최병석, 2015' },
      // 20, 21 — rare only
      { title:'〈표준 사용법 포스터〉', cap:'레어 카드' },
      { title:'〈표준 사용법 포스터〉', cap:'레어 카드' },
    ];

    function simpleHash(s) {
      let h1=0xdeadbeef,h2=0x41c6ce57;
      for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
      h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
      h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
      return(4294967296*(2097151&h2)+(h1>>>0)).toString(36);
    }

    function makeToken(cardNum, isRare) {
      const ts = Date.now();
      const payload = `${cardNum}:${isRare?1:0}:${ts}`;
      const sig = simpleHash(payload+SECRET);
      return btoa(payload+':'+sig).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    }

    async function buildQR() {
      const cvs = document.getElementById('qrCanvas');
      const ld  = document.getElementById('qrLoading');
      try {
        await QRCode.toCanvas(cvs, `${BASE}/card.html`, {
          width: 256, margin: 2,
          errorCorrectionLevel: 'M',
          color: { dark: '#1a1a1a', light: '#ffffff' }
        });
        cvs.style.display = 'block';
        ld.style.display = 'none';
      } catch {
        ld.innerHTML = '<p style="font-size:0.78rem;color:#888;padding:16px;text-align:center">QR 생성 실패</p>';
      }
    }

    function buildTestButtons() {
      const grid = document.getElementById('testGrid');
      for (let i = 1; i <= CARD_COUNT; i++) {
        const btn = document.createElement('button');
        btn.className = 'btn-test';
        btn.textContent = `카드 ${i}`;
        btn.onclick = () => window.open(`${BASE}/card.html?t=${makeToken(i,false)}&preview=1`, '_blank');
        grid.appendChild(btn);
      }
      const rare = document.createElement('button');
      rare.className = 'btn-test rare';
      rare.textContent = 'RARE 카드 확인';
      rare.onclick = () => window.open(`${BASE}/card.html?t=${makeToken(20,true)}&preview=1`, '_blank');
      grid.appendChild(rare);

      // Check-all button
      const checkBtn = document.createElement('button');
      checkBtn.className = 'btn-test';
      checkBtn.style.cssText = 'grid-column:span 3;margin-top:4px;border-color:rgba(0,0,0,0.15);';
      checkBtn.textContent = '전체 순서 확인';
      checkBtn.onclick = buildCheckGrid;
      grid.appendChild(checkBtn);
    }

    function buildCheckGrid() {
      const overlay = document.getElementById('checkOverlay');
      const grid    = document.getElementById('checkGrid');
      grid.innerHTML = '';
      for (let i = 1; i <= 21; i++) {
        const data = CARD_DATA[i];
        const isRare = i >= 20;
        const card = document.createElement('div');
        card.className = 'check-card';
        if (isRare) card.style.cssText = 'border-color:rgba(204,255,0,0.5);box-shadow:0 0 12px rgba(204,255,0,0.18);';
        card.innerHTML = `
          <div class="check-num" style="${isRare?'background:#ccff00;color:#0a0a0a;':''}">${i}${isRare?' ★ RARE':''}</div>
          <div class="check-img-wrap">
            <img src="${IMG_BASE}${i}.png" alt="${i}" onerror="this.style.opacity='0.2'">
          </div>
          <div class="check-info">
            <div class="check-info-title">${data ? data.title : '?'}</div>
            <div class="check-info-cap">${data ? data.cap : ''}</div>
          </div>`;
        grid.appendChild(card);
      }
      overlay.classList.add('open');
    }

    buildQR();
    buildTestButtons();
  </script>
</body>
</html>
